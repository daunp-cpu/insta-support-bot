<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타 댓글 서포트 대시보드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    body {
      background-color: #f7f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      color: #111;
    }
    .section {
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #222;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #0095f6;
    }
    textarea {
      height: 90px;
      resize: vertical;
      line-height: 1.5;
    }
    .template-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .template-item {
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .template-item:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #0095f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #1877f2;
    }
    .btn-submit:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
      word-break: break-all;
    }
    .result-box.success {
      display: block;
      background: #e6f7ec;
      color: #0d6832;
      border: 1px solid #a3e2bb;
    }
    .result-box.error {
      display: block;
      background: #fde8e8;
      color: #c81e1e;
      border: 1px solid #f8b4b4;
    }
    .login-guide {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>인스타그램 서포트 댓글 대시보드</h1>

    <!-- 1. 게시물 링크 입력 -->
    <div class="section">
      <div class="section-title">1. 인스타그램 게시물 링크</div>
      <input type="text" id="postUrl" placeholder="https://www.instagram.com/p/.../">
    </div>

    <!-- 2. 계정 선택 (4개 계정 드롭다운) -->
    <div class="section">
      <div class="section-title">2. 사용할 계정 선택</div>
      <select id="accountSelect">
        <option value="acc_1">오미영 (50대 계정)</option>
        <option value="acc_2">황지석</option>
        <option value="acc_3">김현지</option>
        <option value="acc_4">김일미</option>
      </select>
      <div class="login-guide">
        * 로그인 세션이 유지된 상태여야 댓글이 정상 등록됩니다.
      </div>
    </div>

    <!-- 3. 추천 댓글 선택 -->
    <div class="section">
      <div class="section-title">3. 추천 댓글 선택 (클릭 시 자동 입력)</div>
      <div class="template-list">
        <div class="template-item" onclick="selectTemplate(this)">"이거 친구가 쓰는 거 봤는데 완전 탐나더라구요 바로 샀습니다 🙌"</div>
        <div class="template-item" onclick="selectTemplate(this)">"배송 진짜 빠르네요! 어제 주문했는데 벌써 옴 대박 👍"</div>
        <div class="template-item" onclick="selectTemplate(this)">"요즘 인스타에 자주 보여서 고민 중이었는데 후기 보니까 사야겠어요 ㅎㅎ"</div>
        <div class="template-item" onclick="selectTemplate(this)">"아들놈들이 맨날 궁시렁거리는데 원쁠원이라 바로 구매했어요. 이거쓰고 조용해지기를^^"</div>
      </div>
    </div>

    <!-- 4. 최종 등록할 댓글 내용 -->
    <div class="section">
      <div class="section-title">4. 최종 등록할 댓글 내용</div>
      <textarea id="commentText" placeholder="등록할 댓글을 직접 입력하거나 위 추천 댓글을 선택하세요."></textarea>
    </div>

    <!-- 실행 버튼 -->
    <button id="submitBtn" class="btn-submit" onclick="submitComment()">댓글 자동 등록 실행</button>

    <!-- 결과 안내창 -->
    <div id="resultBox" class="result-box"></div>
  </div>

  <script>
    function selectTemplate(element) {
      const text = element.innerText.replace(/^"|"$/g, '');
      document.getElementById("commentText").value = text;
    }

    async function submitComment() {
      const postUrl = document.getElementById("postUrl").value.trim();
      const accountId = document.getElementById("accountSelect").value;
      const commentText = document.getElementById("commentText").value.trim();
      const submitBtn = document.getElementById("submitBtn");
      const resultBox = document.getElementById("resultBox");

      if (!postUrl) {
        alert("인스타그램 게시물 링크를 입력해주세요.");
        return;
      }
      if (!commentText) {
        alert("댓글 내용을 입력해주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "댓글 등록 작업 진행 중 (약 15~30초)...";
      resultBox.className = "result-box";
      resultBox.style.display = "none";

      try {
        const response = await fetch("/api/comment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            account_id: accountId,
            post_url: postUrl,
            comment_text: commentText
          })
        });

        const data = await response.json();

        if (response.ok) {
          resultBox.className = "result-box success";
          resultBox.innerText = `성공: ${data.message || '댓글이 성공적으로 등록되었습니다!'}`;
        } else {
          resultBox.className = "result-box error";
          resultBox.innerText = `실패: ${data.detail || '댓글 등록에 실패했습니다. 세션 상태를 확인하세요.'}`;
        }
      } catch (err) {
        resultBox.className = "result-box error";
        resultBox.innerText = `서버 연결 오류: 서버가 응답하지 않습니다. (${err.message})`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "댓글 자동 등록 실행";
      }
    }
  </script>
</body>
</html>
